name: Generate bindings

# Builds native meshoptimizer static libraries on each platform, regenerates the
# Odin bindings with odin-c-bindgen, commits the result and publishes a release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "meshoptimizer tag to bind (e.g. v1.2). Empty = latest release."
        required: false
        default: ""
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(curl -fsSL https://api.github.com/repos/zeux/meshoptimizer/releases/latest | jq -r .tag_name)
          fi
          if [ -z "$V" ] || [ "$V" = "null" ]; then
            echo "Could not resolve a meshoptimizer version" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved meshoptimizer version: $V"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pwsh -File scripts/build_windows.ps1
            artifact: meshopt_windows.lib
          - os: ubuntu-latest
            script: bash scripts/build_linux.sh
            artifact: meshopt_linux.a
          - os: macos-latest
            script: bash scripts/build_macos.sh
            artifact: meshopt_macos.a
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout meshoptimizer ${{ needs.resolve.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: zeux/meshoptimizer
          ref: ${{ needs.resolve.outputs.version }}
          path: meshoptimizer
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}
          if-no-files-found: error

  bindings:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (required by odin-c-bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          release: latest
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout meshoptimizer ${{ needs.resolve.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: zeux/meshoptimizer
          ref: ${{ needs.resolve.outputs.version }}
          path: meshoptimizer

      - name: Checkout odin-c-bindgen
        uses: actions/checkout@v4
        with:
          repository: karl-zylinski/odin-c-bindgen
          path: bindgen-tool

      - name: Build bindgen
        run: odin build bindgen-tool/src -out:bindgen.bin -o:speed

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate bindings
        run: |
          set -euxo pipefail
          rm -f meshopt/*.odin
          ./bindgen.bin .
          # Drop the freshly built libraries next to the generated bindings.
          cp artifacts/meshopt_windows.lib/meshopt_windows.lib meshopt/
          cp artifacts/meshopt_linux.a/meshopt_linux.a         meshopt/
          cp artifacts/meshopt_macos.a/meshopt_macos.a         meshopt/
          echo "${{ needs.resolve.outputs.version }}" > .meshopt-version
          ls -la meshopt/

      - name: Verify bindings compile and link (Odin smoke test)
        run: odin build test -out:/tmp/meshopt_test.bin

      - name: Commit updated bindings
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meshopt/ .meshopt-version
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update bindings for meshoptimizer ${{ needs.resolve.outputs.version }}"
            git push
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          name: meshoptimizer ${{ needs.resolve.outputs.version }}
          body: "Odin bindings for [meshoptimizer ${{ needs.resolve.outputs.version }}](https://github.com/zeux/meshoptimizer/releases/tag/${{ needs.resolve.outputs.version }})."
          files: |
            meshopt/meshopt_windows.lib
            meshopt/meshopt_linux.a
            meshopt/meshopt_macos.a
