name: Generate bindings

# Builds native meshoptimizer static libraries on each platform, regenerates the
# Odin bindings with odin-c-bindgen, and then either commits the result and
# publishes a release, or opens a pull request for review (pull_request: true).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "meshoptimizer tag to bind (e.g. v1.2). Empty = latest release."
        required: false
        default: ""
      pull_request:
        description: "Open a pull request instead of committing and releasing."
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      version:
        type: string
        required: false
        default: ""
      pull_request:
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

# The toolchain is pinned so a regeneration is reproducible: an upstream change
# in Odin or in odin-c-bindgen cannot silently alter the generated bindings.
# Bump these deliberately and review the resulting diff.
env:
  ODIN_RELEASE: dev-2026-09
  BINDGEN_REF: 12f4e7adb7ff4be1546ff4c3c3a7a42b637a7315

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          V="${{ inputs.version }}"
          if [ -z "$V" ]; then
            V=$(curl -fsSL https://api.github.com/repos/zeux/meshoptimizer/releases/latest | jq -r .tag_name)
          fi
          if [ -z "$V" ] || [ "$V" = "null" ]; then
            echo "Could not resolve a meshoptimizer version" >&2
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Resolved meshoptimizer version: $V"

  build:
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pwsh -File scripts/build_windows.ps1
            artifact: meshopt_windows.lib
          - os: ubuntu-latest
            script: bash scripts/build_linux.sh
            artifact: meshopt_linux.a
          - os: macos-latest
            script: bash scripts/build_macos.sh
            artifact: meshopt_macos.a
          # The wasm object is compiled against Odin's vendor:libc-shim as its
          # sysroot, so this one needs the Odin toolchain to be present.
          - os: ubuntu-latest
            script: bash scripts/build_wasm.sh
            artifact: meshopt_wasm.o
            needs_odin: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout meshoptimizer ${{ needs.resolve.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: zeux/meshoptimizer
          ref: ${{ needs.resolve.outputs.version }}
          path: meshoptimizer
      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Setup Odin (for vendor:libc-shim)
        if: matrix.needs_odin
        uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install lld (provides wasm-ld)
        if: matrix.needs_odin
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Build
        run: ${{ matrix.script }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/${{ matrix.artifact }}
          if-no-files-found: error

  bindings:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libclang (required by odin-c-bindgen)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          # odin-c-bindgen does `foreign import "system:clang"`, i.e. it links with
          # -lclang. Ubuntu only ships the unversioned libclang.so symlink inside
          # /usr/lib/llvm-<ver>/lib (the default search path has just the versioned
          # libclang-<ver>.so.<ver>), so ld cannot resolve -lclang on its own.
          # Export the directory for the link step below.
          CLANG_SO=$(ls /usr/lib/llvm-*/lib/libclang.so /usr/lib/*/libclang.so 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$CLANG_SO" ]; then
            echo "libclang.so not found after installing libclang-dev" >&2
            ls -la /usr/lib/llvm-*/lib/libclang* /usr/lib/*/libclang* 2>/dev/null || true
            exit 1
          fi
          CLANG_LIB_DIR=$(dirname "$CLANG_SO")
          echo "Found libclang at $CLANG_SO"
          echo "CLANG_LIB_DIR=$CLANG_LIB_DIR" >> "$GITHUB_ENV"
          echo "LIBRARY_PATH=$CLANG_LIB_DIR${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Setup Odin
        uses: laytan/setup-odin@v2
        with:
          release: ${{ env.ODIN_RELEASE }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node runs the wasi_wasm32 smoke test below through its WASI runtime.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Checkout meshoptimizer ${{ needs.resolve.outputs.version }}
        uses: actions/checkout@v4
        with:
          repository: zeux/meshoptimizer
          ref: ${{ needs.resolve.outputs.version }}
          path: meshoptimizer

      - name: Checkout odin-c-bindgen
        uses: actions/checkout@v4
        with:
          repository: karl-zylinski/odin-c-bindgen
          ref: ${{ env.BINDGEN_REF }}
          path: bindgen-tool

      - name: Build bindgen
        run: odin build bindgen-tool/src -out:bindgen.bin -o:speed -extra-linker-flags:"-L$CLANG_LIB_DIR"

      - name: Download built libraries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Fails on any bindgen.sjson key bindgen does not know (it ignores unknown
      # keys silently), then writes bindgen.generated.sjson, which adds #any_int
      # to every size_t parameter so callers do not cast at each call site.
      - name: Validate and expand the bindgen config
        run: python3 scripts/prepare_bindgen.py bindgen-tool/src meshoptimizer/src/meshoptimizer.h

      - name: Generate bindings
        run: |
          set -euxo pipefail
          # Only meshoptimizer.odin is generated. meshopt/wasm.odin is
          # hand-written and has to survive, so do not wipe meshopt/*.odin.
          rm -f meshopt/meshoptimizer.odin
          ./bindgen.bin bindgen.generated.sjson
          # Drop the freshly built libraries next to the generated bindings.
          cp artifacts/meshopt_windows.lib/meshopt_windows.lib meshopt/
          cp artifacts/meshopt_linux.a/meshopt_linux.a         meshopt/
          cp artifacts/meshopt_macos.a/meshopt_macos.a         meshopt/
          cp artifacts/meshopt_wasm.o/meshopt_wasm.o           meshopt/
          echo "${{ needs.resolve.outputs.version }}" > .meshopt-version
          ls -la meshopt/

      - name: Verify bindings compile and link (Odin smoke test)
        run: |
          set -euxo pipefail
          odin build test -out:/tmp/meshopt_test.bin
          /tmp/meshopt_test.bin

      - name: Verify wasm bindings compile, link and run
        run: |
          set -euxo pipefail
          # js_wasm32 only has to link. wasi_wasm32 also runs, which is
          # what actually proves the vendor:libc-shim wiring (malloc, the math
          # routines) works at runtime and not just at link time.
          odin build test -target:js_wasm32   -out:/tmp/meshopt_test_js.wasm
          odin build test -target:wasi_wasm32 -out:/tmp/meshopt_test_wasi.wasm
          node scripts/run_wasi.mjs /tmp/meshopt_test_wasi.wasm

      - name: Commit updated bindings
        if: ${{ !inputs.pull_request }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meshopt/ .meshopt-version
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update bindings for meshoptimizer ${{ needs.resolve.outputs.version }}"
            git push
          fi

      # An upstream bump regenerates the whole binding surface. Route it through
      # a pull request so a person reads the diff before a release goes out.
      - name: Open a pull request with the updated bindings
        if: ${{ inputs.pull_request }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          V="${{ needs.resolve.outputs.version }}"
          BRANCH="bindings/$V"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add meshopt/ .meshopt-version
          if git diff --cached --quiet; then
            echo "No changes to propose."
            exit 0
          fi
          git commit -m "Update bindings for meshoptimizer $V"
          git push --force -u origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "A pull request for $BRANCH is already open; it now carries the new commit."
            exit 0
          fi
          gh pr create --head "$BRANCH" --title "Update bindings for meshoptimizer $V" --body \
            "Regenerated by the \`Generate bindings\` workflow for [meshoptimizer $V](https://github.com/zeux/meshoptimizer/releases/tag/$V).

          The smoke test passed natively and as \`wasi_wasm32\` under Node. Review the
          binding diff, then merge and run \`Generate bindings\` on the default branch to
          publish the release."

      # Ship the release the way Odin's own vendored packages are laid out: one
      # archive whose root is the `meshopt` package directory, bindings and all
      # four platform binaries included, so it can be dropped straight into a
      # project (or into Odin's vendor/) and imported without further steps.
      - name: Package release archives
        if: ${{ !inputs.pull_request }}
        run: |
          set -euxo pipefail
          V="${{ needs.resolve.outputs.version }}"
          rm -rf dist && mkdir -p dist
          cp -r meshopt dist/meshopt
          cp LICENSE dist/meshopt/LICENSE
          (cd dist && zip -qr "../meshopt-odin-$V.zip" meshopt)
          (cd dist && tar czf "../meshopt-odin-$V.tar.gz" meshopt)
          ls -la dist/meshopt "meshopt-odin-$V.zip" "meshopt-odin-$V.tar.gz"

      - name: Publish release
        if: ${{ !inputs.pull_request }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          name: meshoptimizer ${{ needs.resolve.outputs.version }}
          body: |
            Odin bindings for [meshoptimizer ${{ needs.resolve.outputs.version }}](https://github.com/zeux/meshoptimizer/releases/tag/${{ needs.resolve.outputs.version }}).

            Download either archive and drop the `meshopt` directory into your project
            (or into Odin's `vendor/`), then `import meshopt "path/to/meshopt"`. It
            contains the bindings plus prebuilt libraries for Windows, Linux, macOS
            and wasm32.
          files: |
            meshopt-odin-${{ needs.resolve.outputs.version }}.zip
            meshopt-odin-${{ needs.resolve.outputs.version }}.tar.gz
